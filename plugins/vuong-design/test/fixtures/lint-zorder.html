<!doctype html><html><head><meta charset="utf-8"><title>lint</title><style>
:root{--color-bg:#ffffff;--color-ink:#1a1a1a;--color-line:#dddddd;--color-card:#f2f2f2;--color-accent:#3d6b5c;--space-2:8px;--space-3:12px;--space-4:16px;--radius-md:12px;--radius-full:999px;--font-sans:"Be Vietnam Pro",sans-serif;--size-body:14px;--size-caption:12px}
body{margin:0;background:var(--color-bg);color:var(--color-ink);font-family:var(--font-sans);font-size:var(--size-body)}
.frame{width:360px}
.screen{position:relative;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.field{position:relative;padding:var(--space-3);border:1px solid var(--color-line);border-radius:var(--radius-md)}
.card{padding:var(--space-4);background:var(--color-card);border-radius:var(--radius-md)}
.menu{position:absolute;left:0;right:0;top:100%;padding:var(--space-2);background:var(--color-bg);border:1px solid var(--color-line)}
.menu.last{top:60px;left:var(--space-4);right:var(--space-4)}
.icon{position:relative;display:flex;padding:var(--space-2);background:var(--color-card)}
.badge{position:absolute;top:0;right:0;padding:0 var(--space-2);border-radius:var(--radius-full);background:var(--color-accent);font-size:var(--size-caption)}
</style></head><body>
<div class="frame" data-vd-widen><div class="screen" data-vd-screen="A1">
  <div class="field">Chọn<div class="menu">Mục một</div></div>
  <div class="card">Nội dung phía sau</div>
</div></div>
<div class="frame" data-vd-widen><div class="screen" data-vd-screen="A2">
  <div class="field">Chọn</div>
  <div class="card">Nội dung phía sau</div>
  <div class="icon"><span>Chuông</span><span class="badge">3</span></div>
  <div class="menu last">Mục một</div>
</div></div>
</body></html>
