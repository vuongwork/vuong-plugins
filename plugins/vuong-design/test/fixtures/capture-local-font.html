<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>capture-local-font</title>
<style>
  /* Roboto is not linked: Chrome renders a locally installed Roboto if there is one */
  body { margin: 0; font-family: Roboto, sans-serif; }
  .scr { width: 300px; height: 100px; background: #fff; }
  .r { margin: 0; font: 500 16px/20px Roboto, sans-serif; }
</style>
</head>
<body><div class="scr"><p class="r">Thêm giao dịch 35.000</p></div></body>
</html>
