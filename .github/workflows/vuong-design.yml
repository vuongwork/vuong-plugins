# vuong-design tests on Windows, macOS and Linux. The acceptance corpus is not in the repo, so acceptance.test.mjs skips.
name: vuong-design
on:
  push:
    paths: ['plugins/vuong-design/**', '.github/workflows/vuong-design.yml']
  pull_request:
    paths: ['plugins/vuong-design/**', '.github/workflows/vuong-design.yml']
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins/vuong-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright and Chromium outside the plugin
        run: |
          DEPS="$RUNNER_TEMP/vd-devdeps"
          mkdir -p "$DEPS" && cd "$DEPS"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright-core@1.55.0 pixelmatch@5.3.0 pngjs@7.0.0
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright-core install --with-deps chromium; else npx playwright-core install chromium; fi
          echo "VD_PLAYWRIGHT_FROM=$DEPS" >> "$GITHUB_ENV"
      - name: Tests
        run: node --test test/*.test.mjs
