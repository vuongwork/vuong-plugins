# vuong-design compatibility tests on Windows, macOS and Linux: paths and the project file, the Figma plugin install and
# bridge, the local answer / approve servers, the session log, and finding and launching Chromium. The full suite runs
# locally (node --test test/*.test.mjs): its pixel checks depend on each system's font rendering.
name: vuong-design
on:
  push:
    paths: ['plugins/vuong-design/**', '.github/workflows/vuong-design.yml']
  pull_request:
    paths: ['plugins/vuong-design/**', '.github/workflows/vuong-design.yml']
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest] # ubuntu-latest is 26.04, where Playwright 1.55 has no Chromium
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins/vuong-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright and Chromium outside the plugin
        run: |
          DEPS="$RUNNER_TEMP/vd-devdeps"
          mkdir -p "$DEPS" && cd "$DEPS"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright-core@1.55.0 pixelmatch@5.3.0 pngjs@7.0.0
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright-core install --with-deps chromium; else npx playwright-core install chromium; fi
          echo "VD_PLAYWRIGHT_FROM=$DEPS" >> "$GITHUB_ENV"
      - name: Compatibility tests
        run: node --test test/project.test.mjs test/figma-bridge.test.mjs test/answer.test.mjs test/approve.test.mjs test/diagnose.test.mjs test/runs.test.mjs test/browser.test.mjs
