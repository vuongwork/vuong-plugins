<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>infer-raster</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .scr { width: 300px; background: #ffffff; }
  .row { display: flex; gap: 8px; padding: 8px; }
  .blur { width: 40px; height: 40px; background: #60a5fa; filter: blur(2px); }
  .cone { width: 40px; height: 40px; background: conic-gradient(#f00, #00f, #f00); border-radius: 50%; }
  .lin { width: 40px; height: 40px; background: linear-gradient(#fff, #000); }
</style>
</head>
<body>
<div class="scr">
  <div class="row"><div class="blur"></div><div class="cone"></div><div class="lin"></div></div>
</div>
</body>
</html>
