<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>capture-system-font</title>
<style>
  body { margin: 0; }
  .scr { width: 300px; background: #fff; display: flex; flex-direction: column; gap: 8px; padding: 12px; box-sizing: border-box; font-family: system-ui, sans-serif; }
  .t { margin: 0; font-size: 16px; line-height: 20px; }
  .b { margin: 0; font-size: 14px; line-height: 18px; font-weight: 700; }
  .chip { align-self: flex-start; padding: 4px 8px; background: #eee; border-radius: 8px; font-size: 12px; line-height: 16px; }
  .chip::before { content: "#"; font-family: system-ui; }
</style>
</head>
<body><div class="scr"><p class="t">Hôm nay còn chỗ cho ba việc</p><p class="b">Inbox</p><span class="chip">tag</span></div></body>
</html>
