<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>infer-zorder</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .scr { width: 300px; background: #ffffff; }
  .row { display: flex; gap: 12px; padding: 12px; }
  .wrap { position: relative; width: 40px; height: 40px; }
  .icon, .icon2 { width: 40px; height: 40px; background: #cbd5e1; border-radius: 8px; }
  .badge { position: absolute; top: 0; right: 0; width: 14px; height: 14px; background: #e53935; border-radius: 50%; }
  .under { position: absolute; top: 4px; left: 4px; width: 14px; height: 14px; background: #1e88e5; z-index: -1; }
</style>
</head>
<body>
<div class="scr">
  <!-- the positioned badge comes first in the DOM but CSS paints it above the in-flow icon -->
  <div class="row"><div class="wrap"><div class="badge"></div><div class="icon"></div></div>
  <!-- z-index -1 comes last in the DOM but paints below the icon -->
  <div class="wrap"><div class="icon2"></div><div class="under"></div></div></div>
</div>
</body>
</html>
