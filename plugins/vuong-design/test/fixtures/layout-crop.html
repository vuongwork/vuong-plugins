     proxy scales it smoothly (a blurred blend). Geometry, colour, image src / fit / object-position (R50) and every
     other data check match; only the crop at A and B differs.
     (image-rendering is a known gap of R46's unsupported list, parked in the final review. When it is added there,
     this fixture needs another crop-only difference.) -->

</style></head><body><div class="scr"><img class="im" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGN4amkq1/GUQa7j6VNLUwAoBAW9Vyd8NwAAAABJRU5ErkJggg=="><div class="row"><div class="a"></div><div class="tx"></div></div></div></body></html>
