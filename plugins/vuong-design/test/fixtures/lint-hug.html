<!doctype html><html><head><meta charset="utf-8"><title>lint</title><style>
:root{--color-bg:#ffffff;--color-ink:#1a1a1a;--color-card:#f2f2f2;--space-2:8px;--space-3:12px;--space-4:16px;--font-sans:"Be Vietnam Pro",sans-serif;--size-body:14px;--size-body-lh:20px}
body{margin:0;background:var(--color-bg);color:var(--color-ink);font-family:var(--font-sans);font-size:var(--size-body);line-height:var(--size-body-lh)}
.frame{width:360px}
.screen{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.hero{display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
.hero.ok{align-items:stretch;text-align:center}
.row{display:flex;align-items:center}
.col{width:40px;padding:var(--space-2) 0;background:var(--color-card);text-align:center}
.sp{flex:1}
</style></head><body>
<div class="frame" data-vd-widen><div class="screen" data-vd-screen="A1">
  <div class="hero ok"><p>Nắng nhẹ, có mây rải rác. Chiều tối có thể có mưa rào ở vài nơi.</p></div>
  <div class="row"><div class="col">Một</div><div class="sp"></div><div class="col">Hai</div></div>
</div></div>
<div class="frame" data-vd-widen><div class="screen" data-vd-screen="A2">
  <div class="hero"><p>Nắng nhẹ, có mây rải rác. Chiều tối có thể có mưa rào ở vài nơi.</p></div>
  <div class="row"><div class="sp"></div><div class="col">Một</div><div class="sp"></div><div class="col">Hai</div><div class="sp"></div></div>
</div></div>
</body></html>
