<!doctype html><html><head><meta charset="utf-8"><title>lint</title><style>
:root{--color-bg:#ffffff;--color-ink:#1a1a1a;--color-line:#dddddd;--color-accent:#3d6b5c;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--radius-md:12px;--radius-full:999px;--font-sans:"Be Vietnam Pro",sans-serif;--size-body:14px;--size-title:20px}
body{margin:0;background:var(--color-bg);color:var(--color-ink);font-family:var(--font-sans);font-size:var(--size-body)}
.frame{margin:var(--space-4)}
.fixed{width:300px;padding:var(--space-3)}
.hug{padding:var(--space-3)}
.hugkid{width:200px;height:20px;background:var(--color-line)}
</style></head><body>
<div class="frame" data-vd-widen><div class="fixed" data-vd-screen="A1"><p>Fixed width screen</p></div></div>
<div class="frame" data-vd-widen><div class="hug" data-vd-screen="A2"><p>Stretches</p></div></div>
<div class="frame" data-vd-widen><div class="hug" data-vd-screen="A3"><div class="hugkid"></div></div></div>
</body></html>
