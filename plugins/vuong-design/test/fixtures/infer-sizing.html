<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>infer-sizing</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .scr { width: 300px; background: #ffffff; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: #94a3b8; }
  .cell { flex: 1; height: 40px; background: #e2e8f0; }
  .lbl { font-size: 14px; }
</style>
</head>
<body>
<div class="scr">
  <div class="row"><div class="av"></div><div class="cell"></div><span class="lbl">Mới</span></div>
</div>
</body>
</html>
