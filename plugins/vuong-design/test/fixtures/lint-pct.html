<!doctype html><html><head><meta charset="utf-8"><title>lint</title><style>
:root{--color-bg:#ffffff;--color-ink:#1a1a1a;--color-line:#dddddd;--color-accent:#3d6b5c;--space-3:12px;--space-4:16px;--radius-full:999px;--font-sans:"Be Vietnam Pro",sans-serif;--size-body:14px}
body{margin:0;background:var(--color-bg);color:var(--color-ink);font-family:var(--font-sans);font-size:var(--size-body)}
.frame{width:360px}
.screen{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.bar{align-self:stretch;height:8px;border-radius:var(--radius-full);background:var(--color-line)}
.fill{height:100%;border-radius:var(--radius-full);background:var(--color-accent)}
.bar.good{position:relative}
.bar.good .fill{position:absolute;left:0;top:0;bottom:0}
.full{width:100%;height:8px;background:var(--color-line)}
</style></head><body>
<div class="frame" data-vd-widen>
<div class="screen" data-vd-screen="A1">
  <div class="bar bad"><div class="fill" style="width:65%"></div></div>
  <div class="bar good"><div class="fill" style="width:65%"></div></div>
  <div class="full"></div>
</div>
</div>
</body></html>
