<!doctype html>
<html lang="vi">
<head>

<title>infer-overlap</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .scr { width: 300px; background: #ffffff; }

  .wrap { position: relative; width: 40px; height: 40px; }
  .icon { width: 40px; height: 40px; background: #cbd5e1; border-radius: 8px; }
  .badge { position: absolute; top: 0; right: 0; width: 14px; height: 14px; background: #e53935; border-radius: 50%; }
  .label { font-size: 14px; }
</style>
</head>
<body>
<div class="scr">
  <div class="row"><div class="wrap"><div class="icon"></div><div class="badge"></div></div><span class="label">Hộp thư</span></div>
</div>
