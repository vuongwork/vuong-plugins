<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>capture-half-font</title>
<style>
  /* the stand-in Figma family has only a regular face: bold text cannot be rendered in it */
  @font-face { font-family: "HalfFace"; src: local("Georgia"); font-weight: 400; font-style: normal; }
  body { margin: 0; }
  .scr { width: 300px; background: #fff; padding: 12px; font-family: system-ui, sans-serif; }
  .t { margin: 0; font-size: 16px; line-height: 20px; }
  .b { margin: 0; font-size: 14px; line-height: 18px; font-weight: 700; }
</style>
</head>
<body><div class="scr"><p class="t">Regular text</p><p class="b">Bold text</p></div></body>
</html>
